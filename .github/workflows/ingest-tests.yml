name: Ingest tests

# The science core is where a silent error would be most expensive -- a wrong
# scale factor or an inverted QC bit publishes plausible-looking nonsense. Run
# the suite on every change to the pipeline.

on:
  push:
    paths:
      - "ingest/**"
      - ".github/workflows/ingest-tests.yml"
  pull_request:
    paths:
      - "ingest/**"
      - ".github/workflows/ingest-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: ingest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ingest/requirements-dev.txt

      - name: Install HDF4 libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libhdf4-dev

      - name: Install dependencies
        # Both files: the dev set alone omits pyhdf so the suite can run on a
        # machine without libhdf4, but CI has it and should exercise the
        # HDF4 reader too.
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest
